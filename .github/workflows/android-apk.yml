# Tự động build tệp APK Android "Tư vấn tâm lý học đường" trên GitHub Actions
# và phát hành trực tiếp qua GitHub Release để tải về ngay.
name: Build APK Android

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Địa chỉ máy chủ trường (mặc định: https://tuvantamlihocduonglehoan.com)'
        required: false
        default: 'https://tuvantamlihocduonglehoan.com'
  push:
    branches: [main, master]
    paths: ['public/**', 'shared/**', 'mobile/**', '.github/workflows/android-apk.yml']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Chuẩn bị Android SDK (dùng SDK có sẵn trên máy chạy GitHub)
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$SDKMANAGER" ]; then echo "Không tìm thấy sdkmanager trong $SDK_ROOT"; exit 1; fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "build-tools;34.0.0" "platforms;android-34" || true

      - name: Cài Capacitor
        run: npm install --no-audit --no-fund

      - name: Đóng gói giao diện mobile vào app
        env:
          SERVER_URL: ${{ github.event.inputs.server_url || vars.SERVER_URL || 'https://tuvantamlihocduonglehoan.com' }}
        run: node scripts/build-www.mjs

      - name: Tạo dự án Android
        run: |
          npx cap add android
          node scripts/patch-android.mjs
          npx cap sync android
          node scripts/patch-android.mjs

      - name: Build APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Đặt tên tệp APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "Tu-van-tam-ly-hoc-duong.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "LeHoan-$(node -p "require('./package.json').version").apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Tu-van-tam-ly-hoc-duong-APK
          path: mobile/*.apk
          retention-days: 30

      - name: Phát hành bản APK mới nhất lên GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --repo "${{ github.repository }}" --yes || true
          git push origin :refs/tags/apk-latest || true
          gh release create apk-latest "Tu-van-tam-ly-hoc-duong.apk" --repo "${{ github.repository }}" --title "Tư vấn tâm lý học đường - APK Android" --notes "Ứng dụng Android **Tư vấn tâm lý học đường** (Trường THPT Lê Hoàn) — kết nối trực tiếp https://tuvantamlihocduonglehoan.com/mobile"


