# Tự động build tệp APK Android trên GitHub (miễn phí, không cần cài Android Studio).
# Cách dùng: đưa thư mục dự án lên GitHub → tab Actions → "Build APK Android" → Run workflow.
# Xong khoảng 5–8 phút, tải tệp APK ở mục Artifacts của lần chạy.
# Tùy chọn: Settings → Secrets and variables → Actions → Variables → thêm SERVER_URL (vd. https://lehoan.edu.vn)
# để app tự kết nối máy chủ trường; nếu không, người dùng nhập địa chỉ trong app.
name: Build APK Android

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Địa chỉ máy chủ trường (để trống = dùng biến SERVER_URL hoặc để người dùng tự nhập)'
        required: false
        default: ''
  push:
    branches: [main, master]
    paths: ['public/**', 'shared/**', 'mobile/**', '.github/workflows/android-apk.yml']

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Chuẩn bị Android SDK (dùng SDK có sẵn trên máy chạy GitHub)
        run: |
          set -e
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager 2>/dev/null | sort -V | tail -n1)"
          if [ -z "$SDKMANAGER" ]; then echo "Không tìm thấy sdkmanager trong $SDK_ROOT"; exit 1; fi
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "build-tools;34.0.0" "platforms;android-34" || true

      - name: Cài Capacitor
        run: npm install --no-audit --no-fund

      - name: Đóng gói giao diện web vào app
        env:
          SERVER_URL: ${{ github.event.inputs.server_url || vars.SERVER_URL }}
        run: node scripts/build-www.mjs

      - name: Tạo dự án Android
        run: |
          npx cap add android
          node scripts/patch-android.mjs
          npx cap sync android

      - name: Build APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Đổi tên tệp APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "LeHoan-$(node -p "require('./package.json').version").apk"

      - uses: actions/upload-artifact@v4
        with:
          name: LeHoan-APK
          path: mobile/LeHoan-*.apk
          retention-days: 30
