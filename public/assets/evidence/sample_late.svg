<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="cctvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="gateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
  </defs>

  <!-- Background / Night-CCTV ambiance -->
  <rect width="600" height="360" fill="url(#cctvBg)"/>

  <!-- Perspective Floor / School Entrance -->
  <polygon points="40,360 180,180 420,180 560,360" fill="#1f2937" opacity="0.6"/>
  <line x1="300" y1="180" x2="300" y2="360" stroke="#374151" stroke-width="2" stroke-dasharray="10,8"/>

  <!-- School Main Gate Arch -->
  <rect x="140" y="70" width="320" height="110" fill="url(#gateGrad)" stroke="#374151" stroke-width="2" rx="4"/>
  <rect x="160" y="90" width="280" height="90" fill="#030712" opacity="0.7"/>
  <text x="300" y="115" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#93c5fd" text-anchor="middle" letter-spacing="1">CỔNG CHÍNH NHÀ TRƯỜNG</text>
  <text x="300" y="135" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#ef4444" text-anchor="middle">KHU VỰC ĐIỂM DANH GIÁM THỊ ĐẦU GIỜ</text>

  <!-- Clock & Bell at Gate -->
  <circle cx="300" cy="55" r="16" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
  <line x1="300" y1="55" x2="300" y2="45" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
  <line x1="300" y1="55" x2="308" y2="58" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>

  <!-- Student silhouette arriving late -->
  <g transform="translate(260, 190)">
    <!-- Bounding Detection Box -->
    <rect x="-25" y="-10" width="70" height="120" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="6,4"/>
    <rect x="-25" y="-24" width="70" height="14" fill="#ef4444"/>
    <text x="10" y="-13" font-family="monospace" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">HỌC SINH [07:15]</text>
    
    <!-- Person Graphic -->
    <circle cx="10" cy="12" r="12" fill="#f87171"/>
    <!-- Backpack -->
    <rect x="-8" y="26" width="12" height="24" rx="4" fill="#3b82f6"/>
    <!-- Body -->
    <path d="M-2 26 L22 26 L20 70 L0 70 Z" fill="#e2e8f0"/>
    <!-- Legs in motion -->
    <line x1="4" y1="70" x2="-2" y2="105" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
    <line x1="16" y1="70" x2="22" y2="100" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Late Alert Badge -->
  <g transform="translate(420, 40)">
    <rect width="160" height="58" rx="8" fill="rgba(239, 68, 68, 0.95)" stroke="#fca5a5" stroke-width="1.5"/>
    <text x="80" y="24" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#ffffff" text-anchor="middle">⚠️ ĐI HỌC MUỘN</text>
    <text x="80" y="44" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#fee2e2" text-anchor="middle">Tiết 1 (Quá 15 phút)</text>
  </g>

  <!-- Live CCTV HUD Overlay -->
  <circle cx="30" cy="30" r="5" fill="#ef4444"/>
  <text x="42" y="34" font-family="monospace" font-size="12" font-weight="bold" fill="#ef4444">REC ● CAM-01 [GATE]</text>

  <rect x="20" y="315" width="560" height="30" rx="6" fill="rgba(0, 0, 0, 0.85)" stroke="#374151" stroke-width="1"/>
  <text x="35" y="335" font-family="monospace" font-size="11.5" font-weight="bold" fill="#4ade80">
    🕒 14/10/2026 07:15:22 | MSSV: 2126220004 | PHÒNG 10A1 | GIÁM THỊ: ThS. HOÀNG VĂN MINH
  </text>
</svg>
