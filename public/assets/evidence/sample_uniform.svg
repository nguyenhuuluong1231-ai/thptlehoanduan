<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="uniformCctvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="flagPoleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" fill="url(#uniformCctvBg)"/>

  <!-- School Assembly Courtyard Perspective Grid -->
  <polygon points="50,360 200,160 400,160 550,360" fill="#1e293b" opacity="0.6"/>
  <line x1="120" y1="260" x2="480" y2="260" stroke="#334155" stroke-width="1.5" stroke-dasharray="8,6"/>
  <line x1="160" y1="210" x2="440" y2="210" stroke="#334155" stroke-width="1.5" stroke-dasharray="8,6"/>

  <!-- Courtyard Flag Pole in Background -->
  <line x1="300" y1="50" x2="300" y2="190" stroke="url(#flagPoleGrad)" stroke-width="4"/>
  <polygon points="300,55 350,70 300,85" fill="#ef4444"/>
  <circle cx="325" cy="70" r="5" fill="#fbbf24"/>

  <!-- School Banner -->
  <rect x="180" y="20" width="240" height="30" rx="4" fill="rgba(30, 41, 59, 0.85)" stroke="#475569" stroke-width="1"/>
  <text x="300" y="40" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="bold" fill="#e2e8f0" text-anchor="middle">SÂN TRƯỜNG · KHU VỰC CHÀO CỜ</text>

  <!-- Student Uniform Inspection Silhouette -->
  <g transform="translate(255, 175)">
    <!-- Detection Bounding Box -->
    <rect x="-35" y="-15" width="90" height="135" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6,4"/>
    <rect x="-35" y="-31" width="90" height="16" fill="#f59e0b"/>
    <text x="10" y="-19" font-family="monospace" font-size="9" font-weight="bold" fill="#000000" text-anchor="middle">THIẾU THẺ / PHÙ HIỆU</text>

    <!-- Head -->
    <circle cx="10" cy="10" r="14" fill="#fed7aa"/>
    <!-- Uniform Shirt -->
    <path d="M-15 28 L35 28 L30 75 L-10 75 Z" fill="#ffffff"/>
    <polygon points="2,28 10,42 18,28" fill="#3b82f6"/>
    <!-- Red Alert on Chest where ID card should be -->
    <circle cx="20" cy="46" r="9" fill="#ef4444" opacity="0.9"/>
    <text x="20" y="50" font-family="sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">✕</text>
    <!-- Dark trousers -->
    <rect x="-10" y="75" width="40" height="45" fill="#1e293b"/>
  </g>

  <!-- Missing Badge Warning Card -->
  <g transform="translate(400, 70)">
    <rect width="180" height="65" rx="8" fill="rgba(245, 158, 11, 0.95)" stroke="#fde68a" stroke-width="1.5"/>
    <text x="90" y="26" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="900" fill="#0f172a" text-anchor="middle">👔 SAI TÁC PHONG</text>
    <text x="90" y="45" font-family="'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="700" fill="#78350f" text-anchor="middle">Quên thẻ học sinh &amp; phù hiệu</text>
  </g>

  <!-- Live CCTV HUD Overlay -->
  <circle cx="30" cy="30" r="5" fill="#ef4444"/>
  <text x="42" y="34" font-family="monospace" font-size="12" font-weight="bold" fill="#ef4444">REC ● CAM-YARD-02 [CHÀO CỜ]</text>

  <rect x="20" y="315" width="560" height="30" rx="6" fill="rgba(0, 0, 0, 0.85)" stroke="#374151" stroke-width="1"/>
  <text x="35" y="335" font-family="monospace" font-size="11.5" font-weight="bold" fill="#38bdf8">
    🕒 05/10/2026 07:05:14 | MSSV: 2126220004 | LỚP 10A1 | GVCN: CÔ PHAN THỊ THU
  </text>
</svg>
