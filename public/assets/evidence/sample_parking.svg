<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradPark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#bgGradPark)"/>
  
  <!-- Sidewalk and Street -->
  <rect x="0" y="160" width="400" height="100" fill="#475569"/>
  <rect x="0" y="150" width="400" height="10" fill="#94a3b8"/>
  <line x1="0" y1="210" x2="400" y2="210" stroke="#facc15" stroke-width="4" stroke-dasharray="20,15"/>

  <!-- School Gate -->
  <rect x="50" y="40" width="300" height="110" fill="#1e293b" stroke="#64748b" stroke-width="2" rx="4"/>
  <text x="200" y="70" fill="#e2e8f0" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">CỔNG TRƯỜNG THPT / ĐẠI HỌC</text>
  <text x="200" y="92" fill="#38bdf8" font-family="sans-serif" font-size="11" text-anchor="middle">KHU VỰC CẤM TỤ TẬP / LÒNG ĐƯỜNG</text>

  <!-- Prohibited Sign -->
  <circle cx="200" cy="125" r="20" fill="#ef4444"/>
  <text x="200" y="132" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="bold" text-anchor="middle">✕</text>

  <!-- Warning Badge -->
  <rect x="250" y="18" width="140" height="28" rx="5" fill="#f97316"/>
  <text x="320" y="37" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">TỤ TẬP GÂY ÙN TẮC</text>

  <!-- Live Stamp -->
  <rect x="15" y="224" width="270" height="24" rx="4" fill="rgba(0,0,0,0.8)"/>
  <text x="25" y="241" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">📍 Vỉa hè trước cổng - 14/10 17:15</text>
</svg>
