<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 260" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <rect width="400" height="260" fill="url(#bgGrad)"/>
  <!-- Road -->
  <polygon points="50,260 150,140 250,140 350,260" fill="url(#roadGrad)"/>
  <line x1="200" y1="140" x2="200" y2="260" stroke="#facc15" stroke-width="4" stroke-dasharray="15,10"/>
  
  <!-- School Gate Outline in Background -->
  <rect x="90" y="70" width="220" height="70" fill="none" stroke="#475569" stroke-width="2" rx="4"/>
  <text x="200" y="95" fill="#94a3b8" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">CỔNG TRƯỜNG HỌC</text>
  <text x="200" y="115" fill="#ef4444" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">KHU VỰC NGOÀI NHÀ TRƯỜNG</text>
  
  <!-- Motorcycle silhouette -->
  <circle cx="160" cy="205" r="18" fill="#e2e8f0" stroke="#ef4444" stroke-width="3"/>
  <circle cx="240" cy="205" r="18" fill="#e2e8f0" stroke="#ef4444" stroke-width="3"/>
  <path d="M160 205 L190 185 L215 185 L240 205" stroke="#ef4444" stroke-width="6" stroke-linecap="round"/>
  <path d="M190 185 L200 160 L210 160" stroke="#f97316" stroke-width="4" stroke-linecap="round"/>
  <!-- Riders without helmet with alert -->
  <circle cx="195" cy="148" r="8" fill="#f87171"/>
  <circle cx="215" cy="150" r="8" fill="#f87171"/>
  <!-- No Helmet Warning Symbol -->
  <circle cx="340" cy="50" r="32" fill="#ef4444" opacity="0.9"/>
  <text x="340" y="44" fill="#ffffff" font-family="sans-serif" font-size="20" font-weight="900" text-anchor="middle">⚠️</text>
  <text x="340" y="65" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">KHÔNG MŨ BH</text>
  
  <!-- Live Stamp -->
  <rect x="15" y="220" width="250" height="26" rx="4" fill="rgba(0,0,0,0.75)"/>
  <text x="25" y="238" fill="#4ade80" font-family="monospace" font-size="11" font-weight="bold">📍 Cổng chính - 15/10/2026 11:35</text>
</svg>
